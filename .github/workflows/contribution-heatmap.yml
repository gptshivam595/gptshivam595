name: Refresh contribution heatmap

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: contribution-heatmap-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate heatmap data and preview
        run: python scripts/fetch_contributions.py
      - name: Commit refreshed preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+gptshivam595@users.noreply.github.com"
          git add assets/contribution-preview.svg
          if ! git diff --cached --quiet; then
            git commit -m "Refresh contribution heatmap"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
