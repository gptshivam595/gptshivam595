<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Shivam Kumar Gupta's public GitHub contribution heatmap.">
<title>GitHub Contributions | Shivam Kumar Gupta</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#171717;background:#fff}
*{box-sizing:border-box}
body{margin:0;min-width:320px;background:#fff}
.page{width:min(100%,1040px);margin:auto;padding:28px 18px 48px}
.card{border:1px solid #e5e7eb;border-radius:15px;padding:24px 20px 18px;background:#fff;box-shadow:0 1px 3px #0000000a}
.heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
h1{font-size:16px;font-weight:500;line-height:1.3;margin:0}
h1 strong{font-weight:700}
.tools{display:flex;gap:5px}
.tools button{width:34px;height:30px;border:1px solid #e5e7eb;border-radius:6px;background:#fff;color:#737373;cursor:pointer}
.tools button.active{background:#171717;color:#fff;border-color:#171717}
.tools button:focus-visible,.heatmap:focus-visible{outline:2px solid #238636;outline-offset:2px}
.chart{border:1px solid #e5e7eb;border-radius:11px;padding:18px 15px 13px;overflow:hidden}
.heatmap{display:block;width:100%;height:156px;outline:none}
.tooltip{position:fixed;z-index:3;display:none;pointer-events:none;padding:7px 9px;border-radius:6px;background:#171717;color:#fff;font-size:12px;line-height:1.35;box-shadow:0 4px 14px #0002}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding:18px 2px 0}
.stat-label{color:#737373;font-size:12px}
.stat-main{display:flex;align-items:baseline;gap:7px;margin-top:5px}
.stat-value{color:#196127;font-size:28px;font-weight:650;letter-spacing:-.04em;line-height:1}
.stat-unit{font-size:14px}
.stat-sub{margin-top:5px;color:#737373;font-size:12px;white-space:nowrap}
.footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;color:#737373;font-size:12px}
.legend{display:flex;align-items:center;gap:5px}
.swatch{width:13px;height:13px;border-radius:3px;border:0}
.error{margin-top:14px;color:#b42318;font-size:13px}
@media(max-width:700px){.page{padding:14px 10px 30px}.card{padding:17px 12px 14px}.chart{padding:13px 8px 10px}.heatmap{height:145px}.stats{grid-template-columns:repeat(2,1fr);gap:18px 12px}.stat-value{font-size:25px}.footer{align-items:flex-start;flex-direction:column}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="page">
<section class="card" aria-label="GitHub contribution heatmap">
<div class="heading">
<h1><strong id="totalHeading">—</strong> contributions in the last year</h1>
<div class="tools" aria-label="Heatmap view">
<button class="active" type="button" aria-label="Calendar heatmap" aria-pressed="true">▦</button>
<button type="button" aria-label="Contribution details" aria-pressed="false">◌</button>
</div>
</div>
<div class="chart">
<canvas id="heatmap" class="heatmap" tabindex="0" role="img" aria-label="Contribution calendar. Use arrow keys to explore individual days."></canvas>
<div id="tooltip" class="tooltip" role="status"></div>
<div class="stats">
<div><div class="stat-label">1 year total</div><div class="stat-main"><strong id="total" class="stat-value">—</strong><span>contributions</span></div><div id="range" class="stat-sub">Loading…</div></div>
<div><div class="stat-label">Busiest day</div><div class="stat-main"><strong id="busiest" class="stat-value">—</strong><span>contributions</span></div><div id="busiestDate" class="stat-sub">—</div></div>
<div><div class="stat-label">Longest streak</div><div class="stat-main"><strong id="longest" class="stat-value">—</strong><span>days</span></div><div id="longestRange" class="stat-sub">—</div></div>
<div><div class="stat-label">Current streak</div><div class="stat-main"><strong id="current" class="stat-value">—</strong><span>days</span></div><div id="currentRange" class="stat-sub">—</div></div>
</div>
<div class="footer"><span>Hover a day for details · arrow keys to explore</span><span class="legend"><span>Less</span><i class="swatch" style="background:#ebedf0"></i><i class="swatch" style="background:#9be9a8"></i><i class="swatch" style="background:#40c463"></i><i class="swatch" style="background:#30a14e"></i><i class="swatch" style="background:#216e39"></i><span>More</span></span></div>
</div>
<div id="error" class="error" hidden></div>
</section>
</main>
<script>
(function(){
const canvas=document.getElementById('heatmap'),ctx=canvas.getContext('2d'),tip=document.getElementById('tooltip');
const colors=['#ebedf0','#9be9a8','#40c463','#30a14e','#216e39'],fmt=new Intl.NumberFormat('en-US');
const dateFmt=new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'});
let days=[],weeks=0,width=0,height=156,dpr=1,boxes=[],selected=-1;
const dateOf=d=>new Date(d+'T00:00:00Z');
const shortDate=d=>new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',timeZone:'UTC'}).format(dateOf(d));
function quantile(a,p){return a.length?a[Math.floor((a.length-1)*p)]:1}
function level(n,cuts){if(n<=0)return 0;if(n<=cuts[0])return 1;if(n<=cuts[1])return 2;if(n<=cuts[2])return 3;if(n<=cuts[3])return 4;return 5}
function streaks(){let longest={days:0,start:null,end:null},run=0,start=null;days.forEach(d=>{if(d.count){if(!run)start=d.date;run++;if(run>longest.days)longest={days:run,start,end:d.date}}else run=0});let end=days.length-1;if(end>=0&&!days[end].count)end--;let i=end;while(i>=0&&days[i].count)i--;return{longest,current:end>=0?{days:end-i,start:days[i+1].date,end:days[end].date}:{days:0,start:null,end:null}}}
function updateStats(){const total=days.reduce((a,d)=>a+d.count,0),best=days.reduce((a,d)=>d.count>a.count?d:a,{count:0,date:null}),s=streaks();document.getElementById('totalHeading').textContent=fmt.format(total);document.getElementById('total').textContent=fmt.format(total);document.getElementById('range').textContent=shortDate(days[0].date)+' — '+shortDate(days[days.length-1].date);document.getElementById('busiest').textContent=fmt.format(best.count);document.getElementById('busiestDate').textContent=best.date?shortDate(best.date):'—';document.getElementById('longest').textContent=fmt.format(s.longest.days);document.getElementById('longestRange').textContent=s.longest.start?shortDate(s.longest.start)+' — '+shortDate(s.longest.end):'—';document.getElementById('current').textContent=fmt.format(s.current.days);document.getElementById('currentRange').textContent=s.current.start?shortDate(s.current.start)+' — '+shortDate(s.current.end):'—'}
function monthLabels(x,p){const marks=[];let previous='';for(let w=0;w<weeks;w++){const d=days[w*7];if(!d)continue;const key=d.date.slice(0,7);if(key!==previous){marks.push({x:x+w*p,label:new Intl.DateTimeFormat('en-US',{month:'short',timeZone:'UTC'}).format(dateOf(d.date))});previous=key}}return marks}
function draw(){if(!days.length)return;dpr=Math.min(2,window.devicePixelRatio||1);width=Math.max(300,canvas.parentElement.clientWidth-30);canvas.width=width*dpr;canvas.height=height*dpr;canvas.style.height=height+'px';ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,width,height);boxes=[];const cell=Math.max(4,Math.min(14,(width-45)/weeks-3)),gap=Math.max(2,Math.min(4,cell*.25)),pitch=cell+gap,left=Math.max(31,(width-(weeks*pitch-gap))/2),top=29;ctx.font='11px system-ui';ctx.fillStyle='#737373';monthLabels(left,pitch).forEach(m=>ctx.fillText(m.label,m.x,12));[['Mon',1],['Wed',3],['Fri',5]].forEach(([label,row])=>ctx.fillText(label,0,top+row*pitch+cell*.75));const positive=days.map(d=>d.count).filter(Boolean).sort((a,b)=>a-b),cuts=[quantile(positive,.25),quantile(positive,.5),quantile(positive,.75),quantile(positive,.95)];days.forEach((d,i)=>{const x=left+Math.floor(i/7)*pitch,y=top+(i%7)*pitch,lv=level(d.count,cuts);ctx.fillStyle=colors[lv-1]||colors[0];ctx.beginPath();ctx.roundRect(x,y,cell,cell,Math.min(3,cell*.2));ctx.fill();boxes.push({i,x,y,w:cell,h:cell});if(i===selected){ctx.strokeStyle='#171717';ctx.lineWidth=1.5;ctx.stroke()}});if(selected>=0)showTip(selected)}
function showTip(i){const d=days[i];const b=boxes.find(x=>x.i===i);if(!d||!b)return;tip.textContent=(d.count?fmt.format(d.count)+' contribution'+(d.count===1?'':'s'):'No contributions')+' on '+dateFmt.format(dateOf(d.date));tip.style.display='block';const r=canvas.getBoundingClientRect();tip.style.left=(r.left+b.x+b.w/2)+'px';tip.style.top=(r.top+b.y-8)+'px';tip.style.transform='translate(-50%,-100%)'}
function hit(x,y){for(let i=boxes.length-1;i>=0;i--){const b=boxes[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h)return b.i}return -1}
canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect(),i=hit(e.clientX-r.left,e.clientY-r.top);if(i>=0){selected=i;showTip(i)}else{selected=-1;tip.style.display='none'}});
canvas.addEventListener('pointerleave',()=>{selected=-1;tip.style.display='none';draw()});
canvas.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End','Escape'].includes(e.key))return;e.preventDefault();if(e.key==='Escape')selected=-1;else if(e.key==='Home')selected=0;else if(e.key==='End')selected=days.length-1;else if(selected<0)selected=0;else if(e.key==='ArrowLeft')selected=Math.max(0,selected-1);else if(e.key==='ArrowRight')selected=Math.min(days.length-1,selected+1);else if(e.key==='ArrowUp')selected=Math.max(0,selected-1);else if(e.key==='ArrowDown')selected=Math.min(days.length-1,selected+1);draw()});
window.addEventListener('resize',draw);
fetch('./contributions.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Contribution data is not available yet.');return r.json()}).then(data=>{days=data.days.map(d=>({date:d.date,count:Math.max(0,Number(d.count)||0)}));weeks=Math.ceil(days.length/7);updateStats();draw()}).catch(e=>{const el=document.getElementById('error');el.textContent=e.message;el.hidden=false});
})();
</script>
</body>
</html>
